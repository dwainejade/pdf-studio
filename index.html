<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A private, local-first PDF organizer. Explore every page without uploading your files."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1e2026" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eceaf3" media="(prefers-color-scheme: light)" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var saved = JSON.parse(localStorage.getItem('pdf-studio-view-preferences') || '{}')
        var theme = saved.state && saved.state.theme
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
    <title>PDF Studio — Private local PDF organizer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
